name: MiLB daily game logs

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: milb-huggingface-sync
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_PRIVATE: "true"
      START_SEASON: "2021"
      SPORT_IDS: "12,13,14"
      REFRESH_DAYS: "7"
      CHECKPOINT_GAMES: "100"
      MAX_RUN_MINUTES: "150"
      HF_HUB_DOWNLOAD_TIMEOUT: "120"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate configuration
        run: |
          test -n "$HF_REPO_ID" || { echo "Set the HF_REPO_ID repository variable."; exit 1; }
          test -n "$HF_TOKEN" || { echo "Set the HF_TOKEN repository secret."; exit 1; }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Sync one season or refresh current games
        run: python run.py
      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milb-run-${{ github.run_id }}
          path: output/run-summary.json
          if-no-files-found: ignore
          retention-days: 14
